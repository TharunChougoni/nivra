# Small-host settings for the Nivra market archive (PostgreSQL 18 + TimescaleDB).
# Install as /etc/postgresql/18/main/conf.d/nivra-archive.conf.
# Add the host's private address to listen_addresses in a host-only fragment.
shared_preload_libraries = 'timescaledb'
listen_addresses = 'localhost'
max_connections = 8
shared_buffers = 32MB
work_mem = 4MB
maintenance_work_mem = 32MB
effective_cache_size = 256MB
max_worker_processes = 6
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0
# One per-database scheduler plus two policy jobs. With 1, the scheduler takes
# the only slot and compression never runs.
timescaledb.max_background_workers = 3
jit = off
wal_buffers = 1MB
max_wal_size = 256MB
min_wal_size = 64MB
timescaledb.telemetry_level = off
