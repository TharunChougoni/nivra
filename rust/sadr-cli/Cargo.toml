[package]
name = "sadr-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "sadr-rs"
path = "src/main.rs"

[dependencies]
sadr-sandbox = { path = "../sadr-sandbox" }
sadr-core = { path = "../sadr-core" }
serde_json.workspace = true
clap.workspace = true
libc.workspace = true
serde.workspace = true
chrono.workspace = true
sha2.workspace = true
rusqlite.workspace = true
sadr-store = { path = "../sadr-store" }
sadr-research = { path = "../sadr-research" }
ureq = { version = "3", default-features = false, features = ["rustls"] }
flate2 = "1"
base64 = "=0.22.1"
csv = "1"
fs2 = "0.4"
prost = "0.14"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
signal-hook = "0.3"
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time"] }

rustix = { version = "=1.1.4", features = ["fs", "process"] }

[dev-dependencies]
tokio = { version = "=1.53.1", default-features = false, features = ["test-util"] }
tempfile.workspace = true
rusqlite.workspace = true

[lints]
workspace = true
